<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satark — Check a suspicious message</title>
<meta name="description" content="Paste a suspicious SMS, WhatsApp message or screenshot. Satark tells you if it's a scam, why, and what to do next.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f2ea; --card: #fffdf8; --ink: #1d1b16; --muted: #6b6558; --line: #e4ddcf;
    --accent: #c2410c; --accent-ink: #fff;
    --scam: #b42318; --scam-bg: #fdecea; --sus: #a15c07; --sus-bg: #fef3dc; --low: #1f7a4d; --low-bg: #e6f4ec;
    --mark: #ffd8a8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #15130f; --card: #1e1b16; --ink: #f2ede3; --muted: #a39b8b; --line: #332e26;
      --scam: #f97066; --scam-bg: #3a1714; --sus: #fdb022; --sus-bg: #3a2a0c; --low: #47cd89; --low-bg: #0f2e1f;
      --mark: #7a4a12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 16px/1.55 Inter, "Noto Sans Devanagari", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { font-family: Fraunces, Georgia, serif; font-size: 44px; line-height: 1; margin: 0 0 8px; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  header p { margin: 0 0 28px; color: var(--muted); font-size: 18px; max-width: 34em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; }
  textarea { width: 100%; min-height: 150px; resize: vertical; border: 1px solid var(--line); border-radius: 12px;
             padding: 14px; font: inherit; background: var(--paper); color: var(--ink); }
  /* Visible focus for every control, keyboard users included. */
  textarea:focus-visible, select:focus-visible, button:focus-visible, .drop:focus-within, #result:focus-visible, a:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px; }
  .hint { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
  .drop { flex: 1 1 220px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px 14px; color: var(--muted);
          cursor: pointer; font-size: 14px; }
  .drop.has { border-color: var(--accent); color: var(--ink); }
  .preview { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; }
  .preview[hidden] { display: none; }
  .preview img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .preview span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  button.remove { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
                  color: var(--ink); font: 600 20px/1 Inter, sans-serif; cursor: pointer; }
  button.remove:hover { border-color: var(--accent); color: var(--accent); }
  select { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--card); color: var(--ink); font: inherit; }
  button.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 12px 22px;
                   font: 600 16px Inter, "Noto Sans Devanagari", sans-serif; cursor: pointer; }
  button.primary:disabled { opacity: .6; cursor: wait; }
  .samples { margin-top: 16px; font-size: 14px; color: var(--muted); }
  .chip { display: inline-block; margin: 6px 6px 0 0; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line);
          background: transparent; color: var(--ink); font: 13px Inter, sans-serif; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  #result { margin-top: 24px; display: none; }
  .verdict { border-radius: 16px; padding: 20px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
  .verdict.scam { background: var(--scam-bg); color: var(--scam); }
  .verdict.suspicious { background: var(--sus-bg); color: var(--sus); }
  .verdict.low { background: var(--low-bg); color: var(--low); }
  .verdict h2 { font-family: Fraunces, "Noto Sans Devanagari", Georgia, serif; margin: 0; font-size: 28px; line-height: 1.15; }
  .verdict .type { margin-top: 4px; font-weight: 600; }
  .gauge { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font: 700 22px Inter, sans-serif;
           background: conic-gradient(currentColor calc(var(--v) * 1%), color-mix(in srgb, currentColor 15%, transparent) 0); }
  .gauge b { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--card); }
  section.block { margin-top: 18px; }
  section.block h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
  .msg { white-space: pre-wrap; word-break: break-word; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
  ul.flags { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  ul.flags li { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; }
  ul.flags strong { display: block; }
  ul.flags span { color: var(--muted); font-size: 15px; }
  ol.steps { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .note.pending::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 50%;
                          border: 2px solid var(--muted); border-top-color: transparent; animation: spin .8s linear infinite; vertical-align: -1px; }
  .note.warn { color: var(--sus); font-weight: 600; }
  .delta { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 999px; font-size: 14px; font-weight: 600;
           background: color-mix(in srgb, currentColor 14%, transparent); }
  .delta[hidden] { display: none; }   /* display:inline-block above would otherwise beat the hidden attribute */
  .delta.flash { animation: flash 1.6s ease-out 2; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes flash { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 30% { box-shadow: 0 0 0 6px color-mix(in srgb, currentColor 35%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .note.pending::before, .wake::before, .delta.flash { animation: none; } }
  .wake { margin: 0 0 16px; padding: 12px 16px; border-radius: 12px; background: var(--sus-bg); color: var(--sus); font-weight: 600; }
  .wake[hidden] { display: none; }
  .wake::before { content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 8px; border-radius: 50%;
                  border: 2px solid currentColor; border-top-color: transparent; animation: spin .8s linear infinite; vertical-align: -1px; }
  .error { color: var(--scam); margin-top: 12px; }
  footer { margin-top: 40px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
  footer b { color: var(--ink); }
  footer .built { margin-top: 10px; font-size: 13px; }
  @media (max-width: 520px) { header h1 { font-size: 36px; } .verdict h2 { font-size: 23px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Satark<span>.</span></h1>
    <p id="tagline"></p>
  </header>

  <div class="wake" id="wake" role="status" hidden></div>

  <form class="card" id="form">
    <label for="text" class="sr" id="textLabel"></label>
    <textarea id="text" aria-describedby="hint"></textarea>
    <div class="hint" id="hint"></div>
    <div class="row">
      <label class="drop" id="drop">📎 <span id="dropLabel"></span>
        <input type="file" id="image" accept="image/*" class="sr">
      </label>
      <select id="lang">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
        <option value="mr">मराठी</option>
      </select>
      <button class="primary" id="go" type="submit"></button>
    </div>
    <div class="preview" id="preview" hidden>
      <img id="thumb" alt="">
      <span id="fileName"></span>
      <button type="button" class="remove" id="removeImg">×</button>
    </div>
    <div class="samples"><span id="examples"></span><br><span id="chips"></span></div>
    <div class="error" id="error" role="alert"></div>
  </form>

  <div id="announce" class="sr" role="status" aria-live="polite"></div>

  <section id="result" aria-labelledby="headline" tabindex="-1">
    <div class="verdict" id="verdict">
      <div><h2 id="headline"></h2><div class="type" id="type"></div><div class="delta" id="delta" hidden></div></div>
      <div class="gauge" id="gauge" role="img"><b id="risk"></b></div>
    </div>
    <div class="card" style="margin-top:14px">
      <section class="block" style="margin-top:0"><h3 id="hWhy"></h3><div id="explanation"></div></section>
      <section class="block" id="flagsBlock"><h3 id="hFlags"></h3><ul class="flags" id="flags"></ul></section>
      <section class="block"><h3 id="hMsg"></h3><div class="msg" id="msg"></div></section>
      <section class="block"><h3 id="hSteps"></h3><ol class="steps" id="steps"></ol></section>
      <div class="meta" id="meta"><span id="scores"></span><span id="aiNote" class="note"></span></div>
    </div>
  </section>

  <footer>
    <div id="footer"></div>
    <div class="built" id="built"></div>
  </footer>
</main>

<script>
const SAMPLES = [

  ["UPI cashback", "Congratulations! You have won a cashback of ₹5,000 from PhonePe. Scan the QR code and enter your UPI PIN to receive money. Valid for 30 minutes only."],

// Interface strings. The advice steps and the explanation come from the server (the steps are a fixed,
// reviewed playbook), so only the page chrome, the headline and the section titles are translated here.

    check: "संदेश जाँचें", checking: "जाँच हो रही है…", reading: "स्क्रीनशॉट पढ़ा जा रहा है…",
    examples: "उदाहरण आज़माएँ:", removeImg: "स्क्रीनशॉट हटाएँ", thumbAlt: "आपके जोड़े गए स्क्रीनशॉट का पूर्वावलोकन",
    hWhy: "कारण", hFlags: "हमें मिले चेतावनी संकेत", hMsg: "संदेश", hSteps: "अब क्या करें",
    headline_scam: "यह संदेश धोखाधड़ी लगता है", headline_suspicious: "सावधान: इसमें खतरे के संकेत हैं",
    headline_low: "धोखाधड़ी के आम संकेत नहीं मिले",
    scoreRules: "नियम स्कोर", scoreAI: "AI स्कोर", risk: "जोखिम {n}/100",
    noteChecking: "AI दोबारा जाँच रहा है…", noteUnavailable: "AI उपलब्ध नहीं, केवल नियमों का परिणाम",

  },
  mr: {
    tagline: "विचित्र SMS, WhatsApp संदेश किंवा कॉल स्क्रिप्ट मिळाली? क्लिक करण्यापूर्वी, पैसे भरण्यापूर्वी किंवा उत्तर देण्यापूर्वी ती इथे पेस्ट करा.",

    wake: "सर्व्हर सुरू होत आहे… पहिल्यांदा एक मिनिटापर्यंत वेळ लागू शकतो.",
    built: "ForgeHacks 2026 साठी बनवले · AI + सायबर सुरक्षा",
    footer: "पैसे गेले? ताबडतोब <b>1930</b> वर कॉल करा आणि <b>cybercrime.gov.in</b> वर तक्रार करा. Satark तुमचे संदेश साठवत नाही. हे दुसरे मत आहे, हमी नाही.",
  },

const $ = id => document.getElementById(id);
const API = (window.SATARK_API || "") + "/api/check";
const curLang = () => (I18N[$("lang").value] ? $("lang").value : "en");
const t = (key, vars = {}) =>
  (I18N[curLang()][key] ?? I18N.en[key]).replace(/\{(\w+)\}/g, (_, k) => vars[k]);

// Static page text, applied on load and whenever the language select changes.
function applyLang() {
  document.documentElement.lang = curLang();
  $("tagline").textContent = t("tagline");
  $("textLabel").textContent = t("textLabel");
  $("text").placeholder = t("placeholder");
  $("hint").textContent = t("hint");
  $("dropLabel").textContent = t("drop");
  $("lang").setAttribute("aria-label", t("langLabel"));
  $("examples").textContent = t("examples");
  $("removeImg").setAttribute("aria-label", t("removeImg"));
  $("thumb").alt = t("thumbAlt");
  $("hWhy").textContent = t("hWhy");
  $("hFlags").textContent = t("hFlags");
  $("hMsg").textContent = t("hMsg");
  $("hSteps").textContent = t("hSteps");
  $("footer").innerHTML = t("footer");
  $("built").textContent = t("built");
  if (!$("go").disabled) $("go").textContent = t("check");
  if (!$("wake").hidden) $("wake").textContent = t("wake");
  if (lastResult) { render(lastResult); setNote(noteState.key, noteState.kind); }   // re-title an on-screen result
}

// Free hosting sleeps when idle and takes up to a minute to wake. If a request we are waiting on is still
// pending after a few seconds, say so instead of looking frozen. One banner serves every watched request.
const WAKE_AFTER_MS = window.SATARK_WAKE_MS ?? 3000;
let watching = 0;
function watch(promise) {
  watching++;
  const timer = setTimeout(() => { if (watching > 0) { $("wake").textContent = t("wake"); $("wake").hidden = false; } }, WAKE_AFTER_MS);
  const done = () => { clearTimeout(timer); if (--watching === 0) $("wake").hidden = true; };
  promise.then(done, done);
  return promise;
}

let lastResult = null;

SAMPLES.forEach(([name, text]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = name;
  b.onclick = () => { $("text").value = text; clearImage(); $("form").requestSubmit(); };
  $("chips").appendChild(b);
});

let thumbURL = null;
function resetPreview() {
  if (thumbURL) { URL.revokeObjectURL(thumbURL); thumbURL = null; }
  $("thumb").src = ""; $("preview").hidden = true; $("drop").classList.remove("has");
}
function clearImage() {
  $("image").value = "";   // empties the file list too, so only call this to discard the chosen file
  resetPreview();
}
$("image").onchange = e => {
  const f = e.target.files[0];
  resetPreview();          // not clearImage(): that would empty the input and the chosen file would never be sent
  if (!f) return;
  thumbURL = URL.createObjectURL(f);
  $("thumb").src = thumbURL; $("fileName").textContent = f.name;
  $("preview").hidden = false; $("drop").classList.add("has");
};
$("removeImg").onclick = () => { clearImage(); $("image").focus(); };
$("lang").onchange = applyLang;

const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function highlight(text, phrases) {
  const lower = text.toLowerCase(), ranges = [];
  for (const p of phrases) {
    if (!p) continue;
    let i = lower.indexOf(p.toLowerCase());
    while (i !== -1) { ranges.push([i, i + p.length]); i = lower.indexOf(p.toLowerCase(), i + p.length); }
  }
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const r of ranges) {
    const last = merged[merged.length - 1];
    if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push([...r]);
  }
  let out = "", pos = 0;
  for (const [a, b] of merged) { out += esc(text.slice(pos, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>"; pos = b; }
  return out + esc(text.slice(pos));
}

// Screen readers hear one short summary instead of the whole card being re-read on every update.
const announce = msg => { $("announce").textContent = ""; $("announce").textContent = msg; };

function render(d) {
  lastResult = d;
  const v = $("verdict");
  v.className = "verdict " + d.verdict;
  $("headline").textContent = t("headline_" + d.verdict);
  $("type").textContent = d.scam_type || "";
  $("gauge").style.setProperty("--v", d.risk);
  $("gauge").setAttribute("aria-label", t("risk", { n: d.risk }));
  $("risk").textContent = d.risk;
  $("explanation").textContent = d.explanation;

  const flags = $("flags"); flags.innerHTML = "";
  d.signals.forEach(s => {
    const li = document.createElement("li");
    li.innerHTML = `<strong>${esc(s.label)}</strong><span>${esc(s.why)}</span>`;
    flags.appendChild(li);
  });
  d.llm_flags.forEach(f => {
    const li = document.createElement("li");
    li.innerHTML = `<strong>“${esc(f.quote)}”</strong><span>${esc(f.why || "")}</span>`;
    flags.appendChild(li);
  });
  $("flagsBlock").style.display = flags.children.length ? "" : "none";

  $("msg").innerHTML = highlight(d.analysed_text || "", d.highlights);
  const steps = $("steps"); steps.innerHTML = "";
  d.actions.forEach(a => { const li = document.createElement("li"); li.textContent = a; steps.appendChild(li); });
  $("scores").textContent = `${t("scoreRules")} ${d.scores.rules}` + (d.ai_used ? ` · ${t("scoreAI")} ${d.scores.llm}` : "");
  $("result").style.display = "block";
}

// The AI note under the result: pending while we wait, then settled, or a warning if the AI failed.
let noteState = { key: "", kind: "" };   // kept so the note can be re-translated if the language changes
function setNote(key, kind) {
  noteState = { key, kind };
  const n = $("aiNote");
  n.textContent = key ? " · " + t(key) : "";
  n.className = "note" + (kind ? " " + kind : "");
}

function showDelta(before, after) {
  const el = $("delta");
  el.hidden = false;
  el.classList.remove("flash"); void el.offsetWidth;   // restart the animation if it ran before
  const raised = after > before;
  el.textContent = raised ? t("deltaRaised", { a: before, b: after }) : t("deltaAgrees");
  if (raised) el.classList.add("flash");
  return el.textContent;
}

let checkToken = 0;   // a newer submit makes older, slower responses stale

async function callCheck(fd, signal) {
  const r = await fetch(API, { method: "POST", body: fd, signal });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || "Something went wrong.");
  return d;
}

function setBusy(label) { $("go").disabled = !!label; $("go").textContent = label || t("check"); }

$("form").onsubmit = async e => {
  e.preventDefault();
  $("error").textContent = "";
  const mine = ++checkToken;
  const text = $("text").value, lang = $("lang").value, file = $("image").files[0];
  const body = ai => {
    const fd = new FormData();
    fd.append("text", text); fd.append("lang", lang); fd.append("ai", ai);
    if (file) fd.append("image", file);
    return fd;
  };
  const imageOnly = !text.trim() && file;   // reading a screenshot needs the AI, so there's no instant stage
  setBusy(imageOnly ? t("reading") : t("checking"));
  $("delta").hidden = true;
  let first = null;
  try {
    if (!imageOnly) {
      first = await watch(callCheck(body("false")));   // rules only: comes back at once (unless the server is asleep)
      if (mine !== checkToken) return;
      render(first);
      setNote("noteChecking", "pending");
      announce(`${t("headline_" + first.verdict)}. ${t("risk", { n: first.risk })}. ${t("noteChecking")}`);
      $("result").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  } catch (err) {
    if (mine === checkToken) { $("error").textContent = err.message; setBusy(""); }
    return;
  }
  setBusy("");

  // Stage two: the same message with the AI. Bounded, so a slow provider can't leave the note spinning.
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 20000);
  try {
    const second = await callCheck(body("true"), ctl.signal);
    if (mine !== checkToken) return;
    if (!second.ai_used) {
      if (!first) throw new Error("Couldn't read that screenshot right now. Try again, or paste the message text.");
      setNote("noteUnavailable", "warn");
      announce(t("noteUnavailable"));
    } else {
      render(second);                                  // updates the same card in place
      setNote("", "");
      const change = first ? showDelta(first.risk, second.risk) : "";
      announce(`${change ? change + ". " : ""}${t("headline_" + second.verdict)}. ${t("risk", { n: second.risk })}`);
      if (!first) $("result").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  } catch (err) {
    if (mine !== checkToken) return;
    if (first) { setNote("noteUnavailable", "warn"); announce(t("noteUnavailable")); }  // keep the rules result
    else $("error").textContent = err.name === "AbortError" ? "That took too long. Please try again." : err.message;
  } finally {
    clearTimeout(timer);
  }
};

applyLang();

// Android "Share" → Satark (the Web Share Target in manifest.json) opens this page as /?title=…&text=…&url=….
// WhatsApp and SMS put the message in `text`; some apps put a link in `url`, or the message in `title`.
function sharedMessage(search) {
  const p = new URLSearchParams(search || "");
  const get = k => (p.get(k) || "").trim();
  const text = get("text"), title = get("title"), url = get("url");
  const parts = [text || title];
  if (url && !parts[0].includes(url)) parts.push(url);
  return parts.filter(Boolean).join("\n").slice(0, 5000);   // 5000 = the server's text limit
}
const shared = sharedMessage(window.location && window.location.search);
if (shared) {
  $("text").value = shared;
  // Drop the message from the address bar so it isn't kept in history and a refresh doesn't re-send it.
  if (window.history && window.history.replaceState) window.history.replaceState(null, "", window.location.pathname);
  $("form").requestSubmit();
}

// Installable app: the service worker caches only the page shell (see sw.js), never an API response.
if (typeof navigator !== "undefined" && "serviceWorker" in navigator && window.location && /^https?:$/.test(window.location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
}

// Ping the server as soon as the page opens: this wakes a sleeping host while the person reads and types.
watch(fetch((window.SATARK_API || "") + "/api/health",
  typeof AbortSignal !== "undefined" && AbortSignal.timeout ? { signal: AbortSignal.timeout(90000) } : {})).catch(() => {});
</script>
</body>
</html>
